<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Plataformas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="Images/videogame.png">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html"><span class="navbar-brand-icon" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path d="M16.5 18h15a8.5 8.5 0 0 1 8.1 5.9l3.1 9.3a4.7 4.7 0 0 1-8.5 3.8l-3.1-5H16.9l-3.1 5a4.7 4.7 0 0 1-8.5-3.8l3.1-9.3A8.5 8.5 0 0 1 16.5 18Z"/><path d="M14 24v7M10.5 27.5h7M31.5 26h.1M36 30h.1"/></svg></span> GameVerse</a>
        <button class="navbar-toggle" type="button" aria-label="Abrir menú de navegación" aria-controls="main-navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="navbar-nav ms-auto" id="main-navigation">
            <a class="nav-link" href="index.html">Inicio</a>
            <a class="nav-link" href="videojuegos.html">Juegos</a>
            <a class="nav-link" href="generos.html">Géneros</a>
            <a class="nav-link" href="editoras.html">Editoras</a>
            <a class="nav-link" href="plataformas.html">Plataformas</a>
            <a class="nav-link" href="videojuego_plataforma.html">Asignaciones</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card-custom">
        <h1 class="page-title"><span class="page-title-icon" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path d="m20 28-2.8 2.8a6 6 0 0 1-8.5-8.5l5.6-5.6a6 6 0 0 1 8.5 0"/><path d="m28 20 2.8-2.8a6 6 0 0 1 8.5 8.5l-5.6 5.6a6 6 0 0 1-8.5 0"/><path d="m17 31 14-14"/></svg></span>Asignaciones</h1>
        <p>Relaciona videojuegos con plataformas</p>

        <div class="reference-lists">
            <section class="records-section" aria-labelledby="videojuegos-disponibles-titulo">
                <div class="records-heading">
                    <h2 id="videojuegos-disponibles-titulo">Videojuegos disponibles</h2>
                    <span id="conteo-videojuegos" class="records-count" aria-live="polite">Cargando…</span>
                </div>
                <div id="catalogo-videojuegos" class="lista-contenedor"></div>
            </section>
            <section class="records-section" aria-labelledby="plataformas-disponibles-titulo">
                <div class="records-heading">
                    <h2 id="plataformas-disponibles-titulo">Plataformas disponibles</h2>
                    <span id="conteo-plataformas" class="records-count" aria-live="polite">Cargando…</span>
                </div>
                <div id="catalogo-plataformas" class="lista-contenedor"></div>
            </section>
        </div>

        <input type="number" id="videojuego-id" class="form-control" placeholder="ID del videojuego">
        <input type="number" id="plataforma-id" class="form-control" placeholder="ID de la plataforma">

        <div class="mt-3">
            <button class="btn btn-success" onclick="agregarAsignacion()">
                Asignar plataforma
            </button>
        </div>

        <section class="records-section" aria-labelledby="asignaciones-registradas-titulo">
            <div class="records-heading">
                <h2 id="asignaciones-registradas-titulo">Asignaciones registradas</h2>
                <span id="conteo-asignaciones" class="records-count" aria-live="polite">Cargando…</span>
            </div>
            <div id="lista-asignaciones" class="lista-contenedor"></div>
        </section>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script src="js/navigation.js"></script>
</body>
</html>
